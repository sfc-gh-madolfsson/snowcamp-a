<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track A · AI Agents — Buildathon Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root{
    --accent:#29B5E8; --accent-d:#1B98D4; --accent-dd:#0B6BA8;
    --ink:#0B1B2B; --body:#33475b; --muted:#6b7f92;
    --bg:#f2f7fb; --panel:#ffffff; --line:#d6e6f2;
    --code-bg:#eef5fb; --code-ink:#0d3a5c;
    --ok:#16a34a; --ok-bg:#e9f8ee; --ok-line:#8fd6a8;
    --gate:#0E1C2F; --gate-bg:#eef2f7;
    --done:#16a34a; --cur:#29B5E8; --pend:#c3d4e0;
    --shadow:0 6px 24px rgba(11,27,43,.08);
  }
  html,body{ height:100%; }
  body{ font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--body);
    background:radial-gradient(1200px 600px at 85% -10%, #dff1fb 0%, rgba(223,241,251,0) 60%), var(--bg);
    line-height:1.55; min-height:100%; }
  header{ position:sticky; top:0; z-index:50; background:linear-gradient(120deg,#0B1B2B 0%,#0B3557 55%,#0B6BA8 100%);
    color:#fff; padding:20px 34px 22px; box-shadow:var(--shadow); }
  .h-top{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .brand-dot{ width:14px; height:14px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px rgba(41,181,232,.25); flex:0 0 auto; }
  header h1{ font-size:1.5rem; font-weight:800; letter-spacing:-.01em; }
  header .tag{ font-size:.82rem; color:#bfe4f6; font-weight:600; }
  .spacer{ flex:1 1 auto; }
  .hbtn{ border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.08); color:#eaf6fe; font:inherit;
    font-size:.82rem; font-weight:600; padding:8px 14px; border-radius:8px; cursor:pointer; transition:.15s; }
  .hbtn:hover{ background:rgba(255,255,255,.18); }
  .hbtn.warn:hover{ background:#c0392b; border-color:#c0392b; }
  .prog-wrap{ margin-top:16px; display:flex; align-items:center; gap:18px; }
  .prog-track{ flex:1 1 auto; height:12px; border-radius:999px; background:rgba(255,255,255,.16); overflow:hidden; }
  .prog-fill{ height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,var(--accent),#7fe0a1); transition:width .5s cubic-bezier(.4,1.4,.5,1); }
  .prog-meta{ font-size:.85rem; font-weight:700; color:#eaf6fe; white-space:nowrap; }
  .prog-meta .big{ font-size:1.15rem; }
  .now{ font-size:.82rem; color:#bfe4f6; font-weight:600; margin-top:8px; }
  .now b{ color:#fff; }
  .wrap{ max-width:1000px; margin:26px auto 80px; padding:0 26px; }
  .step{ position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px; margin-bottom:16px;
    box-shadow:var(--shadow); overflow:hidden; transition:border-color .2s, box-shadow .2s; }
  .step.cur{ border-color:var(--accent); box-shadow:0 0 0 3px rgba(41,181,232,.18),var(--shadow); }
  .step.done .s-num{ background:var(--done); }
  .step .rail{ position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--pend); }
  .step.done .rail{ background:var(--done); } .step.cur .rail{ background:var(--accent); }
  .s-head{ display:flex; align-items:center; gap:16px; padding:16px 20px 16px 22px; cursor:pointer; user-select:none; }
  .s-head:hover{ background:#f7fbfe; }
  .s-num{ flex:0 0 auto; width:44px; height:44px; border-radius:12px; background:var(--accent-d); color:#fff; font-weight:900;
    font-size:1.1rem; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 10px rgba(27,152,212,.35); }
  .s-titles{ flex:1 1 auto; min-width:0; }
  .s-title{ font-size:1.16rem; font-weight:800; color:var(--ink); letter-spacing:-.01em; }
  .s-goal{ font-size:.9rem; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .step.open .s-goal{ white-space:normal; }
  .s-meta{ flex:0 0 auto; display:flex; align-items:center; gap:12px; }
  .min{ font-size:.78rem; font-weight:700; color:var(--muted); background:#eef4f9; padding:4px 10px; border-radius:999px; white-space:nowrap; }
  .dom{ font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--accent-dd); border:1px solid var(--accent-dd); border-radius:999px; padding:2px 9px; }
  .statechip{ font-size:.72rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:4px 10px; border-radius:999px; }
  .statechip.pend{ color:var(--muted); background:#eef4f9; } .statechip.cur{ color:#fff; background:var(--accent); } .statechip.done{ color:#fff; background:var(--done); }
  .chev{ flex:0 0 auto; width:22px; height:22px; color:var(--muted); transition:transform .25s; }
  .step.open .chev{ transform:rotate(90deg); }
  .s-body{ display:none; padding:4px 24px 22px 24px; border-top:1px solid var(--line); }
  .step.open .s-body{ display:block; animation:fade .25s ease; }
  @keyframes fade{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:none;} }
  .label{ font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; font-weight:800; color:var(--muted); margin:18px 0 7px; }
  .goalbox{ font-size:.98rem; color:var(--ink); background:#f4f9fd; border:1px solid var(--line); border-left:4px solid var(--accent-d); border-radius:8px; padding:11px 15px; margin-top:14px; }
  .goalbox b{ color:var(--accent-dd); }
  .think{ color:var(--muted); font-style:italic; font-size:.9rem; margin:6px 0; }
  .skills .s{ display:inline-block; background:#eef6fc; color:#166a9e; border:1px solid var(--line); border-radius:7px; padding:3px 9px; margin:3px 6px 3px 0; font-family:"SFMono-Regular",Consolas,monospace; font-size:.8rem; font-weight:600; }
  .validate{ background:var(--code-bg); border:1px solid var(--line); border-left:3px solid var(--accent-d); border-radius:0 8px 8px 0; padding:9px 14px; margin:6px 0; font-size:.92rem; color:var(--ink); }
  .validate b{ color:var(--accent-dd); }
  .passif{ background:var(--ok-bg); border-left:3px solid var(--ok); border-radius:0 8px 8px 0; padding:9px 14px; margin:9px 0 2px; font-size:.92rem; }
  .passif b{ color:var(--ok); }
  .gate{ background:var(--gate-bg); border-left:3px solid var(--gate); border-radius:0 8px 8px 0; padding:9px 14px; margin-top:10px; font-size:.92rem; }
  .gate b{ color:var(--gate); }
  .actions{ display:flex; gap:10px; margin-top:20px; padding-top:16px; border-top:1px dashed var(--line); flex-wrap:wrap; }
  .btn{ font:inherit; font-size:.86rem; font-weight:700; padding:10px 18px; border-radius:9px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--body); transition:.15s; }
  .btn:hover{ border-color:var(--accent); color:var(--accent-dd); }
  .btn.primary{ background:var(--done); border-color:var(--done); color:#fff; } .btn.primary:hover{ filter:brightness(1.05); color:#fff; }
  footer{ text-align:center; color:var(--muted); font-size:.8rem; padding:0 0 40px; }
  .step.finale .s-num{ background:linear-gradient(135deg,#16a34a,#29B5E8); }
</style>
</head>
<body>
<header>
  <div class="h-top">
    <span class="brand-dot"></span>
    <div>
      <h1>Track A · AI Agents — Commercial Field Copilot</h1>
      <div class="tag">Novo Nordisk Buildathon · structured + unstructured &rarr; Cortex Agent &rarr; Streamlit on SPCS · ~60 min</div>
    </div>
    <span class="spacer"></span>
    <button class="hbtn" id="expandAll">Expand all</button>
    <button class="hbtn" id="collapseAll">Collapse all</button>
    <button class="hbtn warn" id="reset">Reset</button>
  </div>
  <div class="prog-wrap">
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    <div class="prog-meta"><span class="big" id="progPct">0%</span> &nbsp;·&nbsp; <span id="progCount">0 / 6</span> gates</div>
  </div>
  <div class="now" id="nowLine"></div>
</header>
<div class="wrap" id="wrap"></div>
<footer>Progress saves in this browser. Prompts are yours to invent — the gates only tell you what to achieve.</footer>
<script>
const GATES = [
  { n:"1", title:"Orient & set your rules", min:"8 min",
    achieve:"You start in ACCOUNTADMIN by default, so make the session yours: create your AGENTS.md conventions, then have Cortex Code map the structured tables + the text notes.",
    skills:["/cortex-code-guide","/sql-author"],
    think:["No role switch needed — you're already ACCOUNTADMIN. If you ever hit 'not authorized', it's usually a missing grant, not the role.",
           "Point it at @SNOWCAMP_AGENTS.RAW so it reads real columns; ask what one row means in each table. PII + messy values are planted on purpose — you handle those in G2/G3."],
    validate:"Confirm your AGENTS.md rules; describe the grain of HCP_MASTER, PRESCRIPTIONS, and FIELD_NOTES; name the PII columns.",
    gate:"AGENTS.md exists and you can explain the data + spotted the PII/messy values." },
  { n:"2", title:"Model the numbers — semantic view", min:"12 min",
    achieve:"A semantic view ANALYTICS.NN_COMMERCIAL_SEMANTIC_VIEW: dimensions (HCP, product, territory, tier, month) + metrics (total prescriptions, active prescribers, penetration). Make it robust to messy tier/country values.",
    skills:["/semantic-view"],
    think:["Describe the business language, not SQL. Ask it to validate and fix errors.",
           "If numbers look off, it's the messy tier/country values — ask it to standardize them in the view."],
    validate:"Ask the view: which territories are below-average on penetration this quarter, and their top-tier HCPs?",
    gate:"The view validates and Cortex Analyst returns a sensible answer." },
  { n:"3", title:"Protect it — govern PII", min:"8 min",
    achieve:"Classify + mask the HCP PII (name, email) so only your admin role sees raw values.",
    skills:["/data-governance"],
    think:["Describe the intent ('mask name + email for anyone not me'); don't hand-write the policy."],
    validate:"Select the PII columns as a role without access, then as you.",
    gate:"Masked for the unprivileged role, readable for you." },
  { n:"4", title:"Unlock the text — Cortex Search", min:"10 min",
    achieve:"A Cortex Search service over FIELD_NOTES.NOTE_TEXT, keeping DOC_TYPE, HCP_ID, REGION, NOTE_DATE; skip null text.",
    skills:["/search-optimization"],
    think:["Point search at the text column, keep useful attributes, then test a real commercial theme."],
    validate:"Search 'formulary access barriers' — top 5 with doc type + HCP.",
    gate:"Search returns relevant market-access notes with attributes." },
  { n:"5", title:"Assemble & teach the agent", min:"15 min",
    achieve:"Agent NN_COMMERCIAL_AGENT with two tools (Analyst on the view = numbers; Search on notes = narrative). Set orchestration (route + blend) and response instructions (one-line answer, metrics table, 2-3 cited quotes, next action). Test in Snowflake Intelligence.",
    skills:["/cortex-agent","/agent-optimization","/cortex-chart-customization"],
    think:["Three layers: tools, orchestration (routing/blending), response (shape). Give each tool a crisp description.",
           "If Analyst errors on permissions, grant REFERENCES on the semantic view (see provision file section 4)."],
    validate:"Ask: top-tier underperforming HCPs in the Nordics + what reps noted — watch it use both tools.",
    gate:"Blended question uses both tools and returns the instructed, cited structure." },
  { n:"F", title:"Ship it — Streamlit on SPCS", min:"7 min", dom:"final gate", finale:true,
    achieve:"A Streamlit-in-Snowflake app on the container runtime — your choice: a results view (chat to the agent + KPI panel) or a full app (filters/drill-downs). See shared/streamlit-spcs-deploy.md.",
    skills:["/developing-with-streamlit-in-snowflake","/cortex-chart-customization"],
    think:["RUNTIME_NAME='SYSTEM$ST_CONTAINER_RUNTIME_PY3_11', COMPUTE_POOL=SNOWCAMP_AGENTS_POOL, QUERY_WAREHOUSE=SNOWCAMP_AGENTS_WH.",
           "First launch may be slow while the pool resumes — that's expected."],
    validate:"Open the app URL; ask the in-app chat the Nordics question.",
    gate:"App is live on the container runtime and answers in the UI." }
];
const KEY="snowcamp2026-track-a-v1";
const wrap=document.getElementById("wrap");
let done=load(), openSet=new Set();
function load(){ try{ return new Set(JSON.parse(localStorage.getItem(KEY)||"[]")); }catch{ return new Set(); } }
function save(){ localStorage.setItem(KEY, JSON.stringify([...done])); }
function curIdx(){ for(let i=0;i<GATES.length;i++){ if(!done.has(GATES[i].n)) return i; } return -1; }
function render(){
  const cur=curIdx(); wrap.innerHTML="";
  GATES.forEach((g,i)=>{
    const isDone=done.has(g.n), isCur=(i===cur), isOpen=openSet.has(g.n);
    const state=isDone?"done":(isCur?"cur":"pend"); const lbl=isDone?"Done":(isCur?"Now":"Pending");
    const el=document.createElement("div");
    el.className=`step ${state}${isOpen?" open":""}${g.finale?" finale":""}`; el.dataset.n=g.n;
    el.innerHTML=`
      <div class="rail"></div>
      <div class="s-head">
        <div class="s-num">${g.n}</div>
        <div class="s-titles">
          <div class="s-title">Gate ${g.n} — ${g.title}</div>
          <div class="s-goal">${g.achieve}</div>
        </div>
        <div class="s-meta">
          ${g.dom?`<span class="dom">${g.dom}</span>`:""}
          <span class="min">${g.min}</span>
          <span class="statechip ${state}">${lbl}</span>
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
        </div>
      </div>
      <div class="s-body">
        <div class="goalbox"><b>Achieve:</b> ${g.achieve}</div>
        <div class="label">Skills that help</div>
        <div class="skills">${g.skills.map(s=>`<span class="s">${s}</span>`).join("")}</div>
        <div class="label">Think</div>
        ${g.think.map(t=>`<div class="think">${t}</div>`).join("")}
        <div class="label">Validate — check yourself</div>
        <div class="validate"><b>Try:</b> ${g.validate}</div>
        <div class="gate"><b>Gate:</b> ${g.gate}</div>
        <div class="actions">
          ${isDone?`<button class="btn" data-act="undo">&#8635; Mark not done</button>`
                  :`<button class="btn primary" data-act="done">&#10003; Clear Gate ${g.n}</button>`}
          <button class="btn" data-act="collapse">Collapse</button>
        </div>
      </div>`;
    wrap.appendChild(el);
  });
  const total=GATES.length, n=done.size, pct=Math.round(n/total*100);
  document.getElementById("progFill").style.width=pct+"%";
  document.getElementById("progPct").textContent=pct+"%";
  document.getElementById("progCount").textContent=`${n} / ${total}`;
  const nowEl=document.getElementById("nowLine");
  nowEl.innerHTML = (cur===-1)
    ? "&#127881; <b>All gates cleared</b> — you shipped a governed Cortex Agent and a Streamlit app on SPCS."
    : `Currently on &rarr; <b>Gate ${GATES[cur].n}: ${GATES[cur].title}</b> <span style="opacity:.8">(${GATES[cur].min})</span>`;
  wire();
}
function wire(){
  document.querySelectorAll(".step").forEach(el=>{
    const n=el.dataset.n;
    el.querySelector(".s-head").onclick=()=>{ openSet.has(n)?openSet.delete(n):openSet.add(n); render(); };
    el.querySelectorAll("[data-act]").forEach(b=>{
      b.onclick=e=>{ e.stopPropagation(); const a=b.dataset.act;
        if(a==="done"){ done.add(n); save(); openSet.delete(n); const c=curIdx(); if(c!==-1) openSet.add(GATES[c].n); render(); }
        else if(a==="undo"){ done.delete(n); save(); render(); }
        else if(a==="collapse"){ openSet.delete(n); render(); } };
    });
  });
}
document.getElementById("expandAll").onclick=()=>{ GATES.forEach(g=>openSet.add(g.n)); render(); };
document.getElementById("collapseAll").onclick=()=>{ openSet.clear(); render(); };
document.getElementById("reset").onclick=()=>{ if(confirm("Reset progress?")){ done=new Set(); openSet.clear(); save(); render(); } };
(function(){ const c=curIdx(); if(c!==-1) openSet.add(GATES[c].n); render(); })();
</script>
</body>
</html>
